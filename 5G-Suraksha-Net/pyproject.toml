[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "suraksha-crowd-fight"
version = "0.1.0"
description = "5G Suraksha-Net module: real-time crowd monitoring and temporal fight detection from Sparsh CCTV/RTSP streams"
requires-python = ">=3.11,<3.12"
dependencies = [
    "ultralytics>=8.3.0",
    "opencv-python>=4.9.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.11",
    "lap>=0.4.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
